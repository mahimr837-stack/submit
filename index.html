<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUTEX Cover Selection 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'DM Sans', 'Segoe UI', sans-serif; background: #F7F6F3; color: #1A1916; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #D4D0C8; border-radius: 2px; }
    .fi { width: 100%; padding: 9px 12px; font-size: 13px; font-family: inherit; border: 1px solid #E4E2DC; border-radius: 6px; background: #fff; color: #1A1916; outline: none; transition: border-color 0.15s; display: block; }
    .fi:focus { border-color: #2D6BE4; }
    .fade-in { animation: fadeIn 0.3s ease both; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .btn-p:hover:not(:disabled) { filter: brightness(1.08); }
    .nav-btn:hover { background: rgba(45,107,228,0.08) !important; color: #2D6BE4 !important; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const SUPABASE_URL = "https://bjruudirvlenbouuqytk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqcnV1ZGlydmxlbmJvdXVxeXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjY2ODUsImV4cCI6MjA5Mzc0MjY4NX0.GJzWUrOFdfeKf4nCLV7d0MGfb02wqnhGBIO8wsy97SU";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_PW = "butex@admin2026";
const CHIPS    = ["#4F7DCA","#5B9B72","#C07D4A","#8B68B0","#4A8FA8","#B05870"];
const C = { bg:"#F7F6F3", sur:"#fff", bdr:"#E4E2DC", t1:"#1A1916", t2:"#6B6862", ac:"#2D6BE4" };

const chipColor = s => CHIPS[s.id % CHIPS.length];

function App() {
  const [page, setPage] = useState("home");
  const [subs, setSubs] = useState([]);
  const [votedIds, setVotedIds] = useState(new Set());
  const [adminOpen, setAdminOpen] = useState(false);
  const [loading, setLoading] = useState(false);
  const fileInputRef = useRef(null);

  const [fName, setFName] = useState("");
  const [fBatch, setFBatch] = useState("");
  const [fTitle, setFTitle] = useState("");
  const [fDesc, setFDesc] = useState("");
  const [fFb, setFFb] = useState("");
  const [fFile, setFFile] = useState(null);

  useEffect(() => { fetchSubmissions(); }, []);

  async function fetchSubmissions() {
    const { data, error } = await supabase.from('covers').select('*').order('votes', { ascending: false });
    if (!error) setSubs(data);
  }

  const handleSubmit = async () => {
    if (!fName || !fTitle || !fFile) return alert("Please fill required fields and upload an image.");
    setLoading(true);
    try {
      const fileName = `${Date.now()}-${fFile.name}`;
      const { error: storageError } = await supabase.storage.from('covers').upload(fileName, fFile);
      if (storageError) throw storageError;

      const { data: urlData } = supabase.storage.from('covers').getPublicUrl(fileName);
      
      const { error: dbError } = await supabase.from('covers').insert([{
        full_name: fName, batch_section: fBatch, cover_title: fTitle,
        description: fDesc, facebook_profile: fFb, image_url: urlData.publicUrl,
        is_approved: false, votes: 0
      }]);
      if (dbError) throw dbError;

      alert("Submitted for review!");
      setPage("home");
      fetchSubmissions();
    } catch (err) { alert(err.message); }
    setLoading(false);
  };

  const handleVote = async (id, currentVotes) => {
    if (votedIds.has(id)) return;
    const { error } = await supabase.from('covers').update({ votes: currentVotes + 1 }).eq('id', id);
    if (!error) {
      setVotedIds(prev => new Set([...prev, id]));
      fetchSubmissions();
    }
  };

  const handleToggleApproval = async (id, currentStatus) => {
    const { error } = await supabase.from('covers').update({ is_approved: !currentStatus }).eq('id', id);
    if (!error) fetchSubmissions();
  };

  const approved = subs.filter(s => s.is_approved);

  return (
    <div style={{ minHeight:"100vh", background:C.bg }}>
      <nav style={{ position:"sticky", top:0, zIndex:200, background:"rgba(247,246,243,0.94)", borderBottom:`1px solid ${C.bdr}`, padding:"0 24px", height:56, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div onClick={() => setPage("home")} style={{ cursor:"pointer", fontWeight:700 }}>BUTEX COVER</div>
        <div style={{ display:"flex", gap:10 }}>
          <button onClick={() => setPage("gallery")} style={{ border:"none", background:"none", cursor:"pointer" }}>Gallery</button>
          <button onClick={() => setPage("submit")} style={{ border:"none", background:"none", cursor:"pointer" }}>Submit</button>
          <button onClick={() => setAdminOpen(true)} style={{ border:"none", background:"none", cursor:"pointer" }}>⚙</button>
        </div>
      </nav>

      <main style={{ maxWidth:1000, margin:"0 auto", padding:24 }}>
        {page === "home" && (
          <div className="fade-in">
            <h1>BUTEX Cover Selection 2026</h1>
            <p>Welcome to the Apparel Engineering cover competition.</p>
            <button onClick={() => setPage("submit")} style={{ padding:"10px 20px", background:C.ac, color:"#fff", border:"none", borderRadius:6, marginTop:20 }}>Submit Design</button>
          </div>
        )}

        {page === "gallery" && (
          <div className="grid" style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(250px, 1fr))", gap:20 }}>
            {approved.map(s => (
              <div key={s.id} className="card" style={{ background:"#fff", border:`1px solid ${C.bdr}`, borderRadius:8, overflow:"hidden" }}>
                <img src={s.image_url} style={{ width:"100%", height:150, objectFit:"cover" }} />
                <div style={{ padding:15 }}>
                  <div style={{ fontWeight:600 }}>{s.cover_title}</div>
                  <div style={{ fontSize:12, color:C.t2 }}>{s.full_name} · {s.batch_section}</div>
                  <button onClick={() => handleVote(s.id, s.votes)} style={{ marginTop:10, width:"100%", padding:8, background:votedIds.has(s.id)?C.bg:C.ac, color:votedIds.has(s.id)?C.t1:"#fff", border:"none", borderRadius:4 }}>
                    {votedIds.has(s.id) ? "Voted" : `Vote (${s.votes})`}
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}

        {page === "submit" && (
          <div style={{ maxWidth:400 }}>
            <h2>Submit Design</h2>
            <input className="fi" style={{ marginBottom:10 }} placeholder="Full Name" onChange={e => setFName(e.target.value)} />
            <input className="fi" style={{ marginBottom:10 }} placeholder="Batch/Section" onChange={e => setFBatch(e.target.value)} />
            <input className="fi" style={{ marginBottom:10 }} placeholder="Cover Title" onChange={e => setFTitle(e.target.value)} />
            <textarea className="fi" style={{ marginBottom:10 }} placeholder="Description" onChange={e => setFDesc(e.target.value)} />
            <input type="file" ref={fileInputRef} onChange={e => setFFile(e.target.files[0])} style={{ marginBottom:20 }} />
            <button disabled={loading} onClick={handleSubmit} style={{ width:"100%", padding:12, background:C.ac, color:"#fff", border:"none", borderRadius:6 }}>
              {loading ? "Uploading..." : "Submit Design"}
            </button>
          </div>
        )}
      </main>

      {adminOpen && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000 }}>
          <div style={{ background:"#fff", padding:30, borderRadius:8, width:500, maxHeight:"80vh", overflowY:"auto" }}>
            <h3>Admin Panel</h3>
            {subs.map(s => (
              <div key={s.id} style={{ display:"flex", justifyContent:"space-between", padding:10, borderBottom:`1px solid ${C.bdr}` }}>
                <div>{s.cover_title} ({s.is_approved ? "Approved" : "Pending"})</div>
                <button onClick={() => handleToggleApproval(s.id, s.is_approved)}>
                  {s.is_approved ? "Hide" : "Approve"}
                </button>
              </div>
            ))}
            <button onClick={() => setAdminOpen(false)} style={{ marginTop:20 }}>Close</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
