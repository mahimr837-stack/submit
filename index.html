<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUTEX Cover Selection 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'DM Sans', 'Segoe UI', sans-serif; background: #F7F6F3; color: #1A1916; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #D4D0C8; border-radius: 2px; }

    .fi {
      width: 100%; padding: 9px 12px; font-size: 13px; font-family: inherit;
      border: 1px solid #E4E2DC; border-radius: 6px; background: #fff;
      color: #1A1916; outline: none; transition: border-color 0.15s; display: block;
    }
    .fi:focus { border-color: #2D6BE4; }
    .fi::placeholder { color: #B0ADA6; }
    textarea.fi { resize: vertical; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease both; }

    .nav-btn:hover { background: rgba(45,107,228,0.08) !important; color: #2D6BE4 !important; }
    
    /* FIX: Changed flexDirection to flex-direction */
    .card { transition: box-shadow 0.2s, transform 0.2s; background: #fff; border: 1px solid #E4E2DC; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.08); transform: translateY(-2px); }
    
    .btn-p { background: #2D6BE4; color: #fff; border: none; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: filter 0.15s; }
    .btn-p:hover:not(:disabled) { filter: brightness(1.1); }
    .btn-s { background: #fff; border: 1px solid #E4E2DC; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-s:hover:not(:disabled) { background: #EDEAE3 !important; }
    
    @media (max-width: 580px) { .nav-label { display: none; } }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="text/babel">
const { useState, useEffect } = React;

/* --- CONFIG --- */
// Make sure to replace these with your actual Supabase project credentials
const SUPABASE_URL = "https://bjruudirvlenbouuqytk.supabase.co/rest/v1/"; 
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqcnV1ZGlydmxlbmJvdXVxeXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjY2ODUsImV4cCI6MjA5Mzc0MjY4NX0.GJzWUrOFdfeKf4nCLV7d0MGfb02wqnhGBIO8wsy97SU"; 
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CHIPS = ["#4F7DCA","#5B9B72","#C07D4A","#8B68B0","#4A8FA8","#B05870"];
const C = { bg:"#F7F6F3", sur:"#fff", bdr:"#E4E2DC", t1:"#1A1916", t2:"#6B6862", ac:"#2D6BE4" };

function App() {
  const [page, setPage] = useState("home");
  const [subs, setSubs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [sortBy, setSortBy] = useState("votes");

  // FIX: Initialize votedIds from localStorage to persist votes after refresh
  const [votedIds, setVotedIds] = useState(() => {
    const savedVotes = localStorage.getItem('butex_voted_ids');
    return savedVotes ? new Set(JSON.parse(savedVotes)) : new Set();
  });

  // Submission Form State
  const [fName, setFName] = useState("");
  const [fBatch, setFBatch] = useState("");
  const [fTitle, setFTitle] = useState("");
  const [fImageUrl, setFImageUrl] = useState(""); // FIX: Added image URL state
  const [submitted, setSubmitted] = useState(false);

  useEffect(() => { fetchData(); }, []);

  async function fetchData() {
    setLoading(true);
    const { data, error } = await supabase.from('covers').select('*').order('id', { ascending: false });
    if (!error) setSubs(data || []);
    setLoading(false);
  }

  const handleVote = async (id, currentVotes) => {
    if (votedIds.has(id)) return;

    // FIX: Optimistic UI Update & LocalStorage Save
    const updatedVotedIds = new Set([...votedIds, id]);
    setVotedIds(updatedVotedIds);
    localStorage.setItem('butex_voted_ids', JSON.stringify([...updatedVotedIds]));

    // Instantly update the UI so there is no lag
    setSubs(prevSubs => prevSubs.map(s => 
      s.id === id ? { ...s, votes: (s.votes || 0) + 1 } : s
    ));

    // Send update to database in the background
    const { error } = await supabase.from('covers').update({ votes: (currentVotes || 0) + 1 }).eq('id', id);
    if (error) {
      console.error("Error updating vote:", error);
      // Optional: Handle error by reverting the optimistic update
    }
  };

  const handleSubmit = async () => {
    if (!fName.trim() || !fTitle.trim()) return;
    const { error } = await supabase.from('covers').insert([
      { 
        full_name: fName, 
        batch_section: fBatch, 
        cover_title: fTitle, 
        image_url: fImageUrl, // FIX: Include image URL in submission
        votes: 0, 
        is_approved: false 
      }
    ]);
    if (!error) {
      setSubmitted(true);
      // Clear form
      setFName(""); setFBatch(""); setFTitle(""); setFImageUrl("");
    }
  };

  const approved = subs.filter(s => s.is_approved);
  const sorted = [...approved].sort((a,b) => sortBy==="votes" ? (b.votes - a.votes) : (b.id - a.id));
  const totalVotes = subs.reduce((a,s) => a + (s.votes || 0), 0);

  return (
    <div style={{ minHeight: "100vh", background: C.bg }}>
      {/* Navbar */}
      <nav style={{ position:"sticky", top:0, zIndex:200, background:"rgba(247,246,243,0.94)", backdropFilter:"blur(12px)", borderBottom:`1px solid ${C.bdr}`, padding:"0 24px", height:56, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div onClick={() => setPage("home")} style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer" }}>
          <div style={{ width:28, height:28, background:C.ac, borderRadius:6, display:"flex", alignItems:"center", justifyContent:"center" }}>
            <div style={{ color: "#fff", fontWeight: 900, fontSize: 14 }}>B</div>
          </div>
          <div>
            <div style={{ fontSize:13, fontWeight:700, letterSpacing:1, color:C.t1, lineHeight:1 }}>BUTEX</div>
            <div style={{ fontSize:9, color:C.t2, letterSpacing:0.8 }}>COVER SELECTION</div>
          </div>
        </div>
        <div style={{ display:"flex", gap:2 }}>
          {["home", "gallery", "submit", "results"].map(p => (
            <button key={p} className="nav-btn" onClick={() => setPage(p)} style={{
              background: page===p ? "rgba(45,107,228,0.1)" : "transparent",
              color: page===p ? C.ac : C.t2,
              border:"none", borderRadius:6, padding:"6px 13px", fontSize:13, fontWeight:page===p?600:400, cursor:"pointer"
            }}><span className="nav-label">{p.charAt(0).toUpperCase() + p.slice(1)}</span></button>
          ))}
        </div>
      </nav>

      <main style={{ maxWidth: 1080, margin: "0 auto", padding: "0 24px" }}>
        
        {/* HOME PAGE */}
        {page === "home" && (
          <div className="fade-in" style={{ padding: "70px 0" }}>
            <h1 style={{ fontSize: "clamp(32px, 5vw, 48px)", fontWeight: 700, marginBottom: 16 }}>Department Cover Selection</h1>
            <p style={{ fontSize: 16, color: C.t2, maxWidth: 450, lineHeight: 1.6, marginBottom: 32 }}>
              Submit your cover design and vote for the vision that represents BUTEX in 2026.
            </p>
            <div style={{ display: "flex", gap: 12 }}>
              <button className="btn-p" onClick={() => setPage("submit")}>Submit Design</button>
              <button className="btn-s" onClick={() => setPage("gallery")}>Browse Gallery</button>
            </div>
            <div style={{ display:"flex", gap:14, marginTop: 48 }}>
                <div style={{ padding:"14px 22px", background:C.sur, borderRadius:8, border:`1px solid ${C.bdr}`, textAlign:"center" }}>
                  <div style={{ fontSize:22, fontWeight:700 }}>{approved.length}</div>
                  <div style={{ fontSize:11, color:C.t2 }}>Submissions</div>
                </div>
                <div style={{ padding:"14px 22px", background:C.sur, borderRadius:8, border:`1px solid ${C.bdr}`, textAlign:"center" }}>
                  <div style={{ fontSize:22, fontWeight:700 }}>{totalVotes}</div>
                  <div style={{ fontSize:11, color:C.t2 }}>Total Votes</div>
                </div>
            </div>
          </div>
        )}

        {/* GALLERY PAGE */}
        {page === "gallery" && (
          <div className="fade-in" style={{ padding: "48px 0" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom: 28 }}>
                <div>
                    <h1 style={{ fontSize: 26, fontWeight: 700 }}>Gallery</h1>
                    <p style={{ fontSize: 13, color: C.t2 }}>{approved.length} approved designs</p>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setSortBy("votes")} style={{ padding:"6px 12px", borderRadius:6, border:`1px solid ${C.bdr}`, background: sortBy==="votes"?C.ac:C.sur, color: sortBy==="votes"?"#fff":C.t1, cursor:"pointer", fontSize:12 }}>Top Voted</button>
                    <button onClick={() => setSortBy("newest")} style={{ padding:"6px 12px", borderRadius:6, border:`1px solid ${C.bdr}`, background: sortBy==="newest"?C.ac:C.sur, color: sortBy==="newest"?"#fff":C.t1, cursor:"pointer", fontSize:12 }}>Newest</button>
                </div>
            </div>

            {loading ? <p>Loading...</p> : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 20 }}>
                {sorted.map(s => {
                  const color = CHIPS[s.id % CHIPS.length];
                  return (
                    <div key={s.id} className="card">
                      <div style={{ height: 112, background: color + "14", borderBottom: `1px solid ${C.bdr}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                         {s.image_url ? <img src={s.image_url} alt={s.cover_title} style={{width:'100%', height:'100%', objectFit:'cover'}} /> : <span style={{fontSize:10, fontWeight:700, color}}>BUTEX 2026</span>}
                      </div>
                      <div style={{ padding: 16 }}>
                        <h3 style={{ fontSize: 15, marginBottom: 4 }}>{s.cover_title}</h3>
                        <p style={{ fontSize: 12, color: C.t2, marginBottom: 16 }}>{s.full_name} • {s.batch_section}</p>
                        <button className="btn-p" style={{ width:'100%', background: votedIds.has(s.id) ? C.bg : color, color: votedIds.has(s.id) ? '#999' : '#fff', border: votedIds.has(s.id)?`1px solid ${C.bdr}`:'none' }}
                          disabled={votedIds.has(s.id)} onClick={() => handleVote(s.id, s.votes)}>
                          {votedIds.has(s.id) ? "✓ Voted" : `Vote (${s.votes || 0})`}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* RESULTS PAGE */}
        {page === "results" && (
          <div className="fade-in" style={{ padding: "48px 0" }}>
            <h1 style={{ fontSize: 26, fontWeight: 700, marginBottom: 32 }}>Live Rankings</h1>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {sorted.map((s, i) => {
                const pct = Math.round((s.votes / (sorted[0]?.votes || 1)) * 100);
                return (
                  <div key={s.id} style={{ background: C.sur, border: `1px solid ${C.bdr}`, borderRadius: 8, padding: "12px 16px", display: "flex", alignItems: "center", gap: 16 }}>
                    <div style={{ width: 30, fontWeight: 700, color: i === 0 ? "#D4A800" : C.t2 }}>#{i + 1}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{s.cover_title}</div>
                      <div style={{ fontSize: 11, color: C.t2 }}>{s.full_name}</div>
                    </div>
                    <div style={{ width: 120 }}>
                       <div style={{ fontSize: 12, fontWeight: 700, textAlign: 'right' }}>{s.votes} votes</div>
                       <div style={{ height: 4, background: C.bg, borderRadius: 2, marginTop: 4 }}>
                          <div style={{ height: '100%', background: C.ac, width: `${pct}%`, borderRadius: 2 }} />
                       </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* SUBMIT PAGE */}
        {page === "submit" && (
            <div className="fade-in" style={{ maxWidth: 480, padding: "52px 0" }}>
                {submitted ? (
                    <div style={{textAlign:'center'}}>
                        <h2 style={{color:'#2D9A5B'}}>Submitted!</h2>
                        <p style={{margin:'16px 0', fontSize:14, color:C.t2}}>Your design is pending admin approval.</p>
                        <button className="btn-p" onClick={() => { setPage("gallery"); setSubmitted(false); }}>Go to Gallery</button>
                    </div>
                ) : (
                    <div>
                        <h1 style={{ fontSize: 24, fontWeight: 700, marginBottom: 24 }}>Submit Your Design</h1>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                            <input className="fi" placeholder="Full Name" value={fName} onChange={e => setFName(e.target.value)} />
                            <input className="fi" placeholder="Batch / Section" value={fBatch} onChange={e => setFBatch(e.target.value)} />
                            <input className="fi" placeholder="Cover Title" value={fTitle} onChange={e => setFTitle(e.target.value)} />
                            
                            {/* FIX: Added Image URL input */}
                            <input className="fi" placeholder="Cover Image URL (e.g. Imgur link)" value={fImageUrl} onChange={e => setFImageUrl(e.target.value)} />
                            
                            <button className="btn-p" onClick={handleSubmit}>Submit for Review</button>
                        </div>
                    </div>
                )}
            </div>
        )}

      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
