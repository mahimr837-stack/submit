<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUTEX Department Cover Selection 2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #D4D0C8; border-radius: 2px; }
    input, textarea, select { outline: none; }
    input::placeholder, textarea::placeholder { color: #B0ADA6; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    body { font-family: 'DM Sans', 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Admin password ─────────────────────────────────────────────────────────
    const ADMIN_PASSWORD = "butex@admin2026";

    // ── Initial data ───────────────────────────────────────────────────────────
    const INITIAL_SUBMISSIONS = [
      { id: 1, title: "Threads of Tomorrow", author: "S. Rahman", batch: "BUTEX '28", votes: 142, tag: "Abstract",  approved: true },
      { id: 2, title: "Loom & Legacy",        author: "T. Akter",   batch: "BUTEX '28", votes: 98,  tag: "Geometric", approved: true },
      { id: 3, title: "Woven Identity",       author: "M. Hossain", batch: "BUTEX '28", votes: 87,  tag: "Minimal",   approved: true },
      { id: 4, title: "Fabric of Unity",      author: "R. Islam",   batch: "BUTEX '28", votes: 76,  tag: "Bold",      approved: true },
      { id: 5, title: "Tension & Weave",      author: "N. Begum",   batch: "BUTEX '28", votes: 65,  tag: "Artistic",  approved: true },
      { id: 6, title: "Department Pride",     author: "K. Ahmed",   batch: "BUTEX '28", votes: 54,  tag: "Classic",   approved: true },
    ];

    const CHIPS = ["#4F7DCA","#5B9B72","#C07D4A","#8B68B0","#4A8FA8","#B05870"];

    function App() {
      const [page, setPage]               = useState("home");
      const [submissions, setSubmissions] = useState(INITIAL_SUBMISSIONS);
      const [votedIds, setVotedIds]       = useState(new Set());
      const [sortBy, setSortBy]           = useState("votes");
      const [form, setForm]               = useState({ name:"", batch:"", title:"", desc:"", fb:"" });
      const [submitted, setSubmitted]     = useState(false);

      const [adminOpen, setAdminOpen]     = useState(false);
      const [adminAuth, setAdminAuth]     = useState(false);
      const [pwInput, setPwInput]         = useState("");
      const [pwError, setPwError]         = useState(false);
      const [adminTab, setAdminTab]       = useState("submissions");
      const [addForm, setAddForm]         = useState({ name:"", batch:"", title:"", tag:"Abstract" });

      const [timeLeft, setTimeLeft] = useState({ days:12, hrs:8, mins:34, secs:59 });
      useEffect(() => {
        const t = setInterval(() => {
          setTimeLeft(prev => {
            let { days, hrs, mins, secs } = prev;
            secs--;
            if (secs < 0) { secs = 59; mins--; }
            if (mins < 0) { mins = 59; hrs--; }
            if (hrs < 0)  { hrs = 23; days--; }
            return { days, hrs, mins, secs };
          });
        }, 1000);
        return () => clearInterval(t);
      }, []);

      const approved   = submissions.filter(s => s.approved);
      const sorted     = [...approved].sort((a,b) => sortBy === "votes" ? b.votes - a.votes : b.id - a.id);
      const totalVotes = submissions.reduce((a,s) => a + s.votes, 0);

      const handleVote = (id) => {
        if (votedIds.has(id)) return;
        setVotedIds(prev => new Set([...prev, id]));
        setSubmissions(prev => prev.map(s => s.id === id ? { ...s, votes: s.votes + 1 } : s));
      };

      const handleSubmit = () => {
        if (!form.name || !form.title) return;
        setSubmissions(prev => [...prev, {
          id: Date.now(), title: form.title, author: form.name,
          batch: form.batch || "BUTEX '28", votes: 0,
          tag: "Pending", approved: false,
        }]);
        setSubmitted(true);
      };

      const handleAdminLogin = () => {
        if (pwInput === ADMIN_PASSWORD) { setAdminAuth(true); setPwError(false); }
        else { setPwError(true); }
      };

      const toggleApprove = (id) =>
        setSubmissions(prev => prev.map(s => s.id === id ? { ...s, approved: !s.approved } : s));

      const deleteSubmission = (id) =>
        setSubmissions(prev => prev.filter(s => s.id !== id));

      const handleAdminAdd = () => {
        if (!addForm.name || !addForm.title) return;
        setSubmissions(prev => [...prev, {
          id: Date.now(), title: addForm.title, author: addForm.name,
          batch: addForm.batch || "BUTEX '28", votes: 0,
          tag: addForm.tag, approved: true,
        }]);
        setAddForm({ name:"", batch:"", title:"", tag:"Abstract" });
      };

      const chipColor = (s) => CHIPS[s.id % CHIPS.length];

      const bg      = "#F7F6F3";
      const surface = "#FFFFFF";
      const border  = "#E4E2DC";
      const text1   = "#1A1916";
      const text2   = "#6B6862";
      const accent  = "#2D6BE4";

      const Tag = ({ label, color }) => (
        <span style={{ display:"inline-block", padding:"2px 8px", borderRadius:4,
          fontSize:11, fontWeight:600, letterSpacing:0.4,
          background: color + "18", color, border:`1px solid ${color}30` }}>
          {label}
        </span>
      );

      const Btn = ({ children, onClick, primary, small, danger, disabled }) => (
        <button onClick={onClick} disabled={disabled} style={{
          padding: small ? "6px 14px" : "10px 22px",
          fontSize: small ? 12 : 13, fontWeight: 600, cursor: disabled ? "default" : "pointer",
          border: primary ? "none" : danger ? "none" : `1px solid ${border}`,
          borderRadius: 6, transition: "all 0.15s",
          background: primary ? accent : danger ? "#C0392B" : surface,
          color: primary || danger ? "#fff" : text1,
          opacity: disabled ? 0.5 : 1,
        }}>{children}</button>
      );

      const Input = ({ value, onChange, placeholder, type="text" }) => (
        <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={{
          width:"100%", padding:"9px 12px", fontSize:13, border:`1px solid ${border}`,
          borderRadius:6, background:surface, color:text1, outline:"none",
          fontFamily:"inherit",
        }}
          onFocus={e => e.target.style.borderColor = accent}
          onBlur={e => e.target.style.borderColor = border}
        />
      );

      const SubmissionCard = ({ s, showVote=true }) => {
        const color = chipColor(s);
        const voted = votedIds.has(s.id);
        return (
          <div style={{
            background: surface, border: `1px solid ${border}`, borderRadius: 10,
            overflow:"hidden", display:"flex", flexDirection:"column",
          }}>
            <div style={{
              height: 120, background: color + "18",
              borderBottom: `1px solid ${border}`,
              display:"flex", flexDirection:"column",
              alignItems:"center", justifyContent:"center", gap:6, padding:"0 16px"
            }}>
              <div style={{ width:32, height:2, background: color, opacity:0.7, borderRadius:2 }} />
              <span style={{ fontSize:10, letterSpacing:2, color, fontWeight:600, opacity:0.8 }}>BUTEX · 2026</span>
              <span style={{ fontSize:13, fontWeight:700, color:text1, textAlign:"center" }}>{s.title}</span>
              <div style={{ width:32, height:2, background: color, opacity:0.7, borderRadius:2 }} />
            </div>
            <div style={{ padding:"12px 14px", flex:1, display:"flex", flexDirection:"column", gap:8 }}>
              <div>
                <div style={{ fontWeight:600, fontSize:13, color:text1 }}>{s.title}</div>
                <div style={{ fontSize:12, color:text2, marginTop:2 }}>{s.author} · {s.batch}</div>
              </div>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:"auto" }}>
                <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
                    <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
                  </svg>
                  <span style={{ fontSize:13, fontWeight:700, color:text1 }}>{s.votes}</span>
                </div>
                {showVote && (
                  <button onClick={() => handleVote(s.id)} style={{
                    padding:"5px 14px", fontSize:12, fontWeight:600, borderRadius:5, cursor: voted ? "default":"pointer",
                    border:`1px solid ${voted ? border : color}`,
                    background: voted ? bg : color,
                    color: voted ? text2 : "#fff",
                    transition:"all 0.15s",
                  }}>
                    {voted ? "✓ Voted" : "Vote"}
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      };

      const AdminModal = () => (
        <div style={{
          position:"fixed", inset:0, zIndex:1000, background:"rgba(0,0,0,0.35)",
          display:"flex", alignItems:"center", justifyContent:"center", padding:16,
        }} onClick={e => { if (e.target === e.currentTarget) setAdminOpen(false); }}>
          <div style={{
            background:surface, borderRadius:12, border:`1px solid ${border}`,
            width:"100%", maxWidth:640, maxHeight:"85vh", display:"flex", flexDirection:"column",
            overflow:"hidden",
          }}>
            <div style={{ padding:"18px 24px", borderBottom:`1px solid ${border}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <span style={{ fontWeight:700, fontSize:15, color:text1 }}>Admin Panel</span>
              <button onClick={() => { setAdminOpen(false); setAdminAuth(false); setPwInput(""); }} style={{
                background:"none", border:"none", fontSize:20, cursor:"pointer", color:text2, lineHeight:1,
              }}>×</button>
            </div>

            {!adminAuth ? (
              <div style={{ padding:32, display:"flex", flexDirection:"column", gap:16, alignItems:"center" }}>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke={accent} strokeWidth="1.5" strokeLinecap="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <p style={{ fontSize:13, color:text2, textAlign:"center" }}>Enter the admin password to continue.</p>
                <div style={{ width:"100%", maxWidth:320 }}>
                  <Input type="password" value={pwInput} onChange={e => { setPwInput(e.target.value); setPwError(false); }} placeholder="Admin password" />
                  {pwError && <p style={{ color:"#C0392B", fontSize:12, marginTop:6 }}>Incorrect password.</p>}
                </div>
                <Btn primary onClick={handleAdminLogin}>Sign In</Btn>
              </div>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", flex:1, overflow:"hidden" }}>
                <div style={{ display:"flex", gap:4, padding:"12px 24px", borderBottom:`1px solid ${border}` }}>
                  {[["submissions","Submissions"],["add","Add Entry"]].map(([k,l]) => (
                    <button key={k} onClick={() => setAdminTab(k)} style={{
                      padding:"6px 16px", fontSize:12, fontWeight:600, borderRadius:5, cursor:"pointer",
                      background: adminTab===k ? accent : "transparent",
                      color: adminTab===k ? "#fff" : text2,
                      border:"none",
                    }}>{l}</button>
                  ))}
                </div>

                <div style={{ overflowY:"auto", flex:1, padding:"20px 24px" }}>
                  {adminTab === "submissions" && (
                    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                      {submissions.length === 0 && <p style={{ color:text2, fontSize:13 }}>No submissions yet.</p>}
                      {submissions.map(s => (
                        <div key={s.id} style={{
                          display:"flex", alignItems:"center", gap:12, padding:"12px 14px",
                          background:bg, borderRadius:8, border:`1px solid ${border}`,
                        }}>
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ fontWeight:600, fontSize:13, color:text1 }}>{s.title}</div>
                            <div style={{ fontSize:12, color:text2 }}>{s.author} · {s.batch}</div>
                          </div>
                          <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:text2, flexShrink:0 }}>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                            {s.votes}
                          </div>
                          <Tag label={s.approved ? "Approved" : "Hidden"} color={s.approved ? "#2D9A5B" : "#B05000"} />
                          <button onClick={() => toggleApprove(s.id)} style={{
                            padding:"5px 12px", fontSize:11, fontWeight:600, borderRadius:4, cursor:"pointer",
                            border:`1px solid ${border}`, background:surface, color:text1,
                          }}>{s.approved ? "Hide" : "Show"}</button>
                          <button onClick={() => deleteSubmission(s.id)} style={{
                            padding:"5px 10px", fontSize:11, fontWeight:600, borderRadius:4, cursor:"pointer",
                            border:"1px solid #E8C0C0", background:"#FDF3F3", color:"#C0392B",
                          }}>Delete</button>
                        </div>
                      ))}
                    </div>
                  )}

                  {adminTab === "add" && (
                    <div style={{ display:"flex", flexDirection:"column", gap:14, maxWidth:400 }}>
                      <p style={{ fontSize:13, color:text2 }}>Manually add a submission to the platform.</p>
                      {[
                        { key:"title", label:"Cover Title", placeholder:"e.g. Loom & Legacy", required:true },
                        { key:"name",  label:"Author Name",  placeholder:"Full name", required:true },
                        { key:"batch", label:"Batch",        placeholder:"e.g. BUTEX '28" },
                      ].map(({ key, label, placeholder, required }) => (
                        <div key={key}>
                          <label style={{ display:"block", fontSize:12, fontWeight:600, color:text2, marginBottom:4 }}>
                            {label}{required && <span style={{ color:"#C0392B" }}> *</span>}
                          </label>
                          <Input value={addForm[key]} onChange={e => setAddForm(p => ({ ...p, [key]: e.target.value }))} placeholder={placeholder} />
                        </div>
                      ))}
                      <div>
                        <label style={{ display:"block", fontSize:12, fontWeight:600, color:text2, marginBottom:4 }}>Tag</label>
                        <select value={addForm.tag} onChange={e => setAddForm(p => ({ ...p, tag: e.target.value }))} style={{
                          width:"100%", padding:"9px 12px", fontSize:13, border:`1px solid ${border}`,
                          borderRadius:6, background:surface, color:text1, outline:"none", fontFamily:"inherit",
                        }}>
                          {["Abstract","Geometric","Minimal","Bold","Artistic","Classic"].map(t => (
                            <option key={t}>{t}</option>
                          ))}
                        </select>
                      </div>
                      <Btn primary onClick={handleAdminAdd}>Add Submission</Btn>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );

      return (
        <div style={{ minHeight:"100vh", background:bg, color:text1, fontFamily:"'DM Sans', 'Segoe UI', sans-serif" }}>
          {/* ── Navbar ── */}
          <nav style={{
            position:"sticky", top:0, zIndex:100,
            background:"rgba(247,246,243,0.92)", backdropFilter:"blur(12px)",
            borderBottom:`1px solid ${border}`, padding:"0 24px",
            height:56, display:"flex", alignItems:"center", justifyContent:"space-between",
          }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer" }} onClick={() => setPage("home")}>
              <div style={{ width:28, height:28, background:accent, borderRadius:6, display:"flex", alignItems:"center", justifyContent:"center" }}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="#fff">
                  <rect x="0" y="0" width="6" height="6" rx="1"/>
                  <rect x="8" y="0" width="6" height="6" rx="1"/>
                  <rect x="0" y="8" width="6" height="6" rx="1"/>
                  <rect x="8" y="8" width="6" height="6" rx="1"/>
                </svg>
              </div>
              <div>
                <div style={{ fontSize:13, fontWeight:700, letterSpacing:1, color:text1, lineHeight:1 }}>BUTEX</div>
                <div style={{ fontSize:9, color:text2, letterSpacing:0.8, lineHeight:1.5 }}>COVER SELECTION</div>
              </div>
            </div>

            <div style={{ display:"flex", gap:2, alignItems:"center" }}>
              {[["home","Home"],["gallery","Gallery"],["submit","Submit"],["results","Results"]].map(([p,l]) => (
                <button key={p} onClick={() => setPage(p)} style={{
                  background: page===p ? accent+"15" : "transparent",
                  color: page===p ? accent : text2,
                  border:"none", borderRadius:6, padding:"6px 12px",
                  fontSize:13, fontWeight: page===p ? 600 : 400, cursor:"pointer",
                }}>{l}</button>
              ))}
              <button onClick={() => setAdminOpen(true)} style={{
                marginLeft:8, background:"none", border:`1px solid ${border}`,
                borderRadius:5, padding:"4px 8px", fontSize:10, color:text2,
                cursor:"pointer", letterSpacing:0.3,
              }} title="Admin login">⚙</button>
            </div>
          </nav>

          {adminOpen && <AdminModal />}

          <main style={{ maxWidth:1100, margin:"0 auto", padding:"0 24px" }}>

            {/* HOME */}
            {page === "home" && (
              <div style={{ animation:"fadeIn 0.4s ease both" }}>
                <div style={{ padding:"72px 0 56px", borderBottom:`1px solid ${border}` }}>
                  <p style={{ fontSize:12, fontWeight:600, letterSpacing:2, color:accent, textTransform:"uppercase", marginBottom:16 }}>
                    Bangladesh University of Textiles · 2026
                  </p>
                  <h1 style={{ fontSize:"clamp(28px, 5vw, 52px)", fontWeight:700, letterSpacing:-1, lineHeight:1.15, color:text1, maxWidth:560, marginBottom:16 }}>
                    Department Cover<br/>Selection
                  </h1>
                  <p style={{ fontSize:15, color:text2, maxWidth:440, lineHeight:1.75, marginBottom:32 }}>
                    A student-led design competition to choose the official cover for our department. Submit your design, vote for your favourite, and see what wins.
                  </p>
                  <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                    <Btn primary onClick={() => setPage("submit")}>Submit Your Design</Btn>
                    <Btn onClick={() => setPage("gallery")}>Browse Gallery</Btn>
                  </div>
                </div>

                <div style={{ display:"flex", gap:24, padding:"32px 0", borderBottom:`1px solid ${border}`, flexWrap:"wrap" }}>
                  {[
                    { label:"Submissions",   val: approved.length },
                    { label:"Total Votes",   val: totalVotes },
                    { label:"Days Left",     val: timeLeft.days },
                    { label:"Voting Closes", val: `${String(timeLeft.hrs).padStart(2,"0")}:${String(timeLeft.mins).padStart(2,"0")}:${String(timeLeft.secs).padStart(2,"0")}` },
                  ].map(({ label, val }) => (
                    <div key={label} style={{ padding:"16px 24px", background:surface, borderRadius:8, border:`1px solid ${border}`, textAlign:"center", minWidth:120 }}>
                      <div style={{ fontSize:22, fontWeight:700, color:text1, fontVariantNumeric:"tabular-nums" }}>{val}</div>
                      <div style={{ fontSize:11, color:text2, marginTop:3, letterSpacing:0.5 }}>{label}</div>
                    </div>
                  ))}
                </div>

                <div style={{ padding:"40px 0 64px" }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:24 }}>
                    <h2 style={{ fontSize:17, fontWeight:700, color:text1 }}>Latest Submissions</h2>
                    <button onClick={() => setPage("gallery")} style={{ background:"none", border:"none", color:accent, fontSize:13, fontWeight:500, cursor:"pointer" }}>View all →</button>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))", gap:14 }}>
                    {sorted.slice(0,3).map(s => <SubmissionCard key={s.id} s={s} />)}
                  </div>
                </div>
              </div>
            )}

            {/* GALLERY */}
            {page === "gallery" && (
              <div style={{ padding:"48px 0 64px", animation:"fadeIn 0.4s ease both" }}>
                <h1 style={{ fontSize:26, fontWeight:700, marginBottom:6, color:text1 }}>Gallery</h1>
                <p style={{ fontSize:13, color:text2, marginBottom:28 }}>{approved.length} designs submitted by BUTEX students</p>
                <div style={{ display:"flex", gap:8, marginBottom:28 }}>
                  {[["votes","Top Voted"],["newest","Newest"]].map(([v,l]) => (
                    <button key={v} onClick={() => setSortBy(v)} style={{
                      padding:"6px 14px", fontSize:12, fontWeight:600, borderRadius:5, cursor:"pointer",
                      background: sortBy===v ? accent : surface,
                      color: sortBy===v ? "#fff" : text2,
                      border:`1px solid ${sortBy===v ? accent : border}`,
                    }}>{l}</button>
                  ))}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))", gap:14 }}>
                  {sorted.map(s => <SubmissionCard key={s.id} s={s} />)}
                </div>
              </div>
            )}

            {/* SUBMIT */}
            {page === "submit" && (
              <div style={{ maxWidth:480, padding:"56px 0 80px", animation:"fadeIn 0.4s ease both" }}>
                {submitted ? (
                  <div style={{ textAlign:"center", paddingTop:32 }}>
                    <div style={{ width:64, height:64, borderRadius:"50%", background:"#EAF7EF", border:"2px solid #2D9A5B", display:"flex", alignItems:"center", justifyContent:"center", fontSize:26, margin:"0 auto 20px" }}>✓</div>
                    <h2 style={{ fontSize:22, fontWeight:700, color:"#2D9A5B", marginBottom:10 }}>Design Submitted!</h2>
                    <p style={{ fontSize:14, color:text2, lineHeight:1.7, marginBottom:28 }}>
                      Your submission is pending admin review. Once approved it'll appear in the gallery for voting.
                    </p>
                    <div style={{ display:"flex", gap:10, justifyContent:"center" }}>
                      <Btn primary onClick={() => { setPage("gallery"); setSubmitted(false); setForm({ name:"",batch:"",title:"",desc:"",fb:"" }); }}>View Gallery</Btn>
                      <Btn onClick={() => setSubmitted(false)}>Submit Another</Btn>
                    </div>
                  </div>
                ) : (
                  <div>
                    <h1 style={{ fontSize:24, fontWeight:700, marginBottom:6, color:text1 }}>Submit Your Design</h1>
                    <p style={{ fontSize:13, color:text2, marginBottom:32 }}>Share your vision for the BUTEX 2026 department cover.</p>

                    {[
                      { key:"name",  label:"Full Name",         placeholder:"Your full name",           required:true },
                      { key:"batch", label:"Batch / Section",   placeholder:"e.g. BUTEX '28, Section A" },
                      { key:"title", label:"Cover Title",       placeholder:"Give your design a title", required:true },
                      { key:"fb",    label:"Facebook (optional)", placeholder:"facebook.com/yourname" },
                    ].map(({ key, label, placeholder, required }) => (
                      <div key={key} style={{ marginBottom:18 }}>
                        <label style={{ display:"block", fontSize:12, fontWeight:600, color:text2, marginBottom:6 }}>
                          {label}{required && <span style={{ color:"#C0392B" }}> *</span>}
                        </label>
                        <Input value={form[key]} onChange={e => setForm(p => ({ ...p, [key]: e.target.value }))} placeholder={placeholder} />
                      </div>
                    ))}

                    <div style={{ marginBottom:18 }}>
                      <label style={{ display:"block", fontSize:12, fontWeight:600, color:text2, marginBottom:6 }}>Short Description</label>
                      <textarea value={form.desc} onChange={e => setForm(p => ({ ...p, desc: e.target.value }))}
                        placeholder="What inspired this design?" rows={3} style={{
                          width:"100%", padding:"9px 12px", fontSize:13, border:`1px solid ${border}`,
                          borderRadius:6, background:surface, color:text1, resize:"vertical", fontFamily:"inherit",
                        }}
                        onFocus={e => e.target.style.borderColor = accent}
                        onBlur={e => e.target.style.borderColor = border}
                      />
                    </div>

                    <div style={{
                      border:`2px dashed ${border}`, borderRadius:8, padding:"28px 20px",
                      textAlign:"center", marginBottom:24, cursor:"pointer",
                    }}
                      onMouseEnter={e => e.currentTarget.style.borderColor = accent}
                      onMouseLeave={e => e.currentTarget.style.borderColor = border}
                    >
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={text2} strokeWidth="1.5" strokeLinecap="round" style={{ marginBottom:8 }}>
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                      </svg>
                      <div style={{ fontSize:13, color:text1, fontWeight:500, marginBottom:4 }}>Upload cover image</div>
                      <div style={{ fontSize:12, color:text2 }}>PNG, JPG · Recommended: 1640 × 924 px</div>
                    </div>

                    <Btn primary onClick={handleSubmit}>Submit Design</Btn>
                  </div>
                )}
              </div>
            )}

            {/* RESULTS */}
            {page === "results" && (
              <div style={{ padding:"48px 0 64px", animation:"fadeIn 0.4s ease both" }}>
                <h1 style={{ fontSize:26, fontWeight:700, marginBottom:6, color:text1 }}>Results</h1>
                <p style={{ fontSize:13, color:text2, marginBottom:40 }}>Live vote counts — updated in real time.</p>

                {sorted[0] && (
                  <div style={{
                    background:surface, border:`1px solid ${border}`, borderRadius:10,
                    padding:"24px 28px", marginBottom:24, display:"flex", gap:24, alignItems:"center", flexWrap:"wrap",
                  }}>
                    <div style={{
                      width:120, height:84, background: chipColor(sorted[0])+"18",
                      borderRadius:8, border:`1px solid ${border}`,
                      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4, flexShrink:0,
                    }}>
                      <div style={{ width:24, height:2, background:chipColor(sorted[0]), borderRadius:2 }} />
                      <span style={{ fontSize:9, letterSpacing:2, color:chipColor(sorted[0]), fontWeight:600 }}>BUTEX</span>
                      <span style={{ fontSize:11, fontWeight:700, color:text1 }}>{sorted[0].title}</span>
                      <div style={{ width:24, height:2, background:chipColor(sorted[0]), borderRadius:2 }} />
                    </div>
                    <div>
                      <p style={{ fontSize:11, fontWeight:700, letterSpacing:1.5, color:"#B08000", textTransform:"uppercase", marginBottom:6 }}>🏆 Winner</p>
                      <h2 style={{ fontSize:20, fontWeight:700, color:text1, marginBottom:4 }}>{sorted[0].title}</h2>
                      <p style={{ fontSize:13, color:text2, marginBottom:14 }}>by {sorted[0].author} · {sorted[0].batch}</p>
                      <div style={{ display:"flex", gap:12 }}>
                        <div style={{ padding:"8px 16px", background:bg, borderRadius:6, border:`1px solid ${border}`, textAlign:"center" }}>
                          <div style={{ fontSize:18, fontWeight:700, color:text1 }}>{sorted[0].votes}</div>
                          <div style={{ fontSize:10, color:text2 }}>Votes</div>
                        </div>
                        <div style={{ padding:"8px 16px", background:bg, borderRadius:6, border:`1px solid ${border}`, textAlign:"center" }}>
                          <div style={{ fontSize:18, fontWeight:700, color:text1 }}>#1</div>
                          <div style={{ fontSize:10, color:text2 }}>Rank</div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                <h3 style={{ fontSize:13, fontWeight:700, color:text2, letterSpacing:1, textTransform:"uppercase", marginBottom:14 }}>Full Rankings</h3>
                <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                  {sorted.map((s, i) => (
                    <div key={s.id} style={{
                      background:surface, border:`1px solid ${border}`, borderRadius:8,
                      padding:"12px 18px", display:"flex", alignItems:"center", gap:14,
                    }}>
                      <div style={{
                        width:30, height:30, borderRadius:"50%", flexShrink:0,
                        background: i===0 ? "#FFF4CC" : bg,
                        border:`1px solid ${i===0 ? "#D4A800" : border}`,
                        display:"flex", alignItems:"center", justifyContent:"center",
                        fontSize:12, fontWeight:700, color: i===0 ? "#B08000" : text2,
                      }}>{i+1}</div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontWeight:600, fontSize:13, color:text1 }}>{s.title}</div>
                        <div style={{ fontSize:12, color:text2 }}>{s.author}</div>
                      </div>
                      <div style={{ width:100, display:"flex", flexDirection:"column", gap:3, flexShrink:0 }}>
                        <div style={{ height:4, background:bg, borderRadius:2, overflow:"hidden", border:`1px solid ${border}` }}>
                          <div style={{
                            height:"100%", borderRadius:2,
                            width:`${sorted[0]?.votes ? (s.votes/sorted[0].votes)*100 : 0}%`,
                            background: chipColor(s),
                            transition:"width 0.4s",
                          }} />
                        </div>
                        <div style={{ fontSize:11, color:text2, textAlign:"right" }}>{s.votes} votes</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          <footer style={{ borderTop:`1px solid ${border}`, padding:"18px 24px", textAlign:"center", color:text2, fontSize:11, letterSpacing:0.4 }}>
            BUTEX Department Cover Selection 2026 · Made by first-year students
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
