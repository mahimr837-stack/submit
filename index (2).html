<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUTEX Cover Selection 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'DM Sans', 'Segoe UI', sans-serif; background: #F7F6F3; color: #1A1916; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #D4D0C8; border-radius: 2px; }

    /* All inputs styled via CSS — no useState inside input components */
    .fi {
      width: 100%;
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid #E4E2DC;
      border-radius: 6px;
      background: #fff;
      color: #1A1916;
      outline: none;
      transition: border-color 0.15s;
      display: block;
    }
    .fi:focus { border-color: #2D6BE4; }
    .fi::placeholder { color: #B0ADA6; }
    textarea.fi { resize: vertical; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease both; }

    .nav-btn:hover { background: rgba(45,107,228,0.08) !important; color: #2D6BE4 !important; }
    .card { transition: box-shadow 0.2s, transform 0.2s; }
    .card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .btn-p:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-s:hover:not(:disabled) { background: #EDEAE3 !important; }
    .vote-btn:hover:not(:disabled) { filter: brightness(0.9); }
    .admin-row:hover { background: #EDEAE3 !important; }
    .upload-zone:hover { border-color: #2D6BE4 !important; }
    .no-scroll { overflow: hidden; }

    @media (max-width: 580px) {
      .nav-label { display: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

/* ── Constants ──────────────────────────────────────────────────────────── */
const ADMIN_PW = "butex@admin2026";
const CHIPS    = ["#4F7DCA","#5B9B72","#C07D4A","#8B68B0","#4A8FA8","#B05870"];
const TAGS     = ["Abstract","Geometric","Minimal","Bold","Artistic","Classic"];
const C = { bg:"#F7F6F3", sur:"#fff", bdr:"#E4E2DC", t1:"#1A1916", t2:"#6B6862", ac:"#2D6BE4" };

const DEMO = [
  { id:1, title:"Threads of Tomorrow", author:"S. Rahman",  batch:"BUTEX '28", votes:142, approved:true },
  { id:2, title:"Loom & Legacy",        author:"T. Akter",   batch:"BUTEX '28", votes:98,  approved:true },
  { id:3, title:"Woven Identity",       author:"M. Hossain", batch:"BUTEX '28", votes:87,  approved:true },
  { id:4, title:"Fabric of Unity",      author:"R. Islam",   batch:"BUTEX '28", votes:76,  approved:true },
  { id:5, title:"Tension & Weave",      author:"N. Begum",   batch:"BUTEX '28", votes:65,  approved:true },
  { id:6, title:"Department Pride",     author:"K. Ahmed",   batch:"BUTEX '28", votes:54,  approved:true },
];

const chipColor = s => CHIPS[s.id % CHIPS.length];
const pad = n => String(n).padStart(2,"0");

/* ── Shared tiny components (NO internal state — safe to define outside App) */
function Btn({ children, onClick, primary, danger, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled}
      className={primary ? "btn-p" : "btn-s"}
      style={{
        padding:"10px 22px", fontSize:13, fontWeight:600, fontFamily:"inherit",
        cursor: disabled ? "default" : "pointer",
        border: primary||danger ? "none" : `1px solid ${C.bdr}`,
        borderRadius:6,
        background: primary ? C.ac : danger ? "#C0392B" : C.sur,
        color: primary||danger ? "#fff" : C.t1,
        opacity: disabled ? 0.55 : 1,
        transition:"filter 0.15s, background 0.15s",
      }}>{children}</button>
  );
}

function SmBtn({ children, onClick, red }) {
  return (
    <button onClick={onClick} style={{
      padding:"4px 10px", fontSize:11, fontWeight:600, fontFamily:"inherit",
      cursor:"pointer", borderRadius:4,
      border: red ? "1px solid #E8C0C0" : `1px solid ${C.bdr}`,
      background: red ? "#FDF3F3" : C.sur,
      color: red ? "#C0392B" : C.t1,
    }}>{children}</button>
  );
}

function Tag({ label, color }) {
  return (
    <span style={{
      display:"inline-block", padding:"2px 8px", borderRadius:4,
      fontSize:11, fontWeight:600, letterSpacing:0.4,
      background:color+"18", color, border:`1px solid ${color}30`,
    }}>{label}</span>
  );
}

function Card({ s, onVote, voted }) {
  const color = chipColor(s);
  return (
    <div className="card" style={{
      background:C.sur, border:`1px solid ${C.bdr}`,
      borderRadius:10, overflow:"hidden", display:"flex", flexDirection:"column",
    }}>
      <div style={{
        height:112, background:color+"14", borderBottom:`1px solid ${C.bdr}`,
        display:"flex", flexDirection:"column",
        alignItems:"center", justifyContent:"center", gap:5, padding:"0 16px",
      }}>
        <div style={{ width:28, height:2, background:color, opacity:0.7, borderRadius:2 }} />
        <span style={{ fontSize:9, letterSpacing:2.5, color, fontWeight:700 }}>BUTEX · 2026</span>
        <span style={{ fontSize:12, fontWeight:700, color:C.t1, textAlign:"center", lineHeight:1.3 }}>{s.title}</span>
        <div style={{ width:28, height:2, background:color, opacity:0.7, borderRadius:2 }} />
      </div>
      <div style={{ padding:"12px 14px", flex:1, display:"flex", flexDirection:"column", gap:8 }}>
        <div>
          <div style={{ fontWeight:600, fontSize:13, color:C.t1 }}>{s.title}</div>
          <div style={{ fontSize:11, color:C.t2, marginTop:2 }}>{s.author} · {s.batch}</div>
        </div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:"auto", paddingTop:6 }}>
          <span style={{ fontSize:13, fontWeight:700, color:C.t1 }}>👍 {s.votes}</span>
          <button className="vote-btn" onClick={() => onVote(s.id)} disabled={voted}
            style={{
              padding:"5px 14px", fontSize:12, fontWeight:600, fontFamily:"inherit",
              borderRadius:5, cursor:voted?"default":"pointer",
              border:`1px solid ${voted ? C.bdr : color}`,
              background: voted ? C.bg : color,
              color: voted ? C.t2 : "#fff",
              transition:"filter 0.15s",
            }}>{voted ? "✓ Voted" : "Vote"}</button>
        </div>
      </div>
    </div>
  );
}

/* ── Admin Modal ─────────────────────────────────────────────────────────── */
/* KEY FIX: All input values are plain useState at THIS component's top level.
   No wrapper component with its own useState around <input>.
   This prevents the remount-on-every-keystroke bug.                          */
function AdminModal({ onClose, subs, onToggle, onDelete, onAdd }) {
  const [auth,   setAuth]   = useState(false);
  const [pw,     setPw]     = useState("");
  const [pwErr,  setPwErr]  = useState(false);
  const [tab,    setTab]    = useState("list");
  // Add-entry fields — flat, at this component's top level
  const [aTitle, setATitle] = useState("");
  const [aName,  setAName]  = useState("");
  const [aBatch, setABatch] = useState("");
  const [aTag,   setATag]   = useState("Abstract");

  useEffect(() => {
    document.body.classList.add("no-scroll");
    return () => document.body.classList.remove("no-scroll");
  }, []);

  const tryLogin = () => {
    if (pw === ADMIN_PW) { setAuth(true); setPwErr(false); }
    else setPwErr(true);
  };

  const doAdd = () => {
    if (!aTitle.trim() || !aName.trim()) return;
    onAdd({ title:aTitle, name:aName, batch:aBatch, tag:aTag });
    setATitle(""); setAName(""); setABatch(""); setATag("Abstract");
  };

  return (
    <div onClick={e => e.target===e.currentTarget && onClose()}
      style={{
        position:"fixed", inset:0, zIndex:1000,
        background:"rgba(0,0,0,0.28)", backdropFilter:"blur(4px)",
        display:"flex", alignItems:"center", justifyContent:"center", padding:16,
      }}>
      <div style={{
        background:C.sur, borderRadius:12, border:`1px solid ${C.bdr}`,
        width:"100%", maxWidth:620, maxHeight:"88vh",
        display:"flex", flexDirection:"column", overflow:"hidden",
        boxShadow:"0 20px 60px rgba(0,0,0,0.13)",
      }}>
        {/* Header */}
        <div style={{
          padding:"15px 22px", borderBottom:`1px solid ${C.bdr}`,
          display:"flex", alignItems:"center", justifyContent:"space-between",
        }}>
          <span style={{ fontWeight:700, fontSize:15 }}>{auth ? "Admin Panel" : "Admin Login"}</span>
          <button onClick={onClose} style={{ background:"none", border:"none", fontSize:22, cursor:"pointer", color:C.t2 }}>×</button>
        </div>

        {!auth ? (
          <div style={{ padding:40, display:"flex", flexDirection:"column", alignItems:"center", gap:16 }}>
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke={C.ac} strokeWidth="1.5" strokeLinecap="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <p style={{ fontSize:13, color:C.t2 }}>Enter the admin password to continue.</p>
            <div style={{ width:"100%", maxWidth:300 }}>
              {/* Plain input, no wrapper component */}
              <input className="fi" type="password" value={pw}
                onChange={e => { setPw(e.target.value); setPwErr(false); }}
                onKeyDown={e => e.key==="Enter" && tryLogin()}
                placeholder="Password" />
              {pwErr && <p style={{ color:"#C0392B", fontSize:12, marginTop:6 }}>Incorrect password.</p>}
            </div>
            <Btn primary onClick={tryLogin}>Sign In</Btn>
          </div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", flex:1, overflow:"hidden" }}>
            <div style={{ display:"flex", gap:4, padding:"10px 20px", borderBottom:`1px solid ${C.bdr}` }}>
              {[["list","Submissions"],["add","Add Entry"]].map(([k,l]) => (
                <button key={k} onClick={() => setTab(k)} style={{
                  padding:"6px 16px", fontSize:12, fontWeight:600, fontFamily:"inherit",
                  borderRadius:5, cursor:"pointer", border:"none",
                  background: tab===k ? C.ac : "transparent",
                  color:      tab===k ? "#fff" : C.t2,
                }}>{l}</button>
              ))}
            </div>

            <div style={{ flex:1, overflowY:"auto", padding:"16px 20px" }}>

              {tab === "list" && (
                <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                  {subs.length === 0 && <p style={{ color:C.t2, fontSize:13 }}>No submissions yet.</p>}
                  {subs.map(s => (
                    <div key={s.id} className="admin-row" style={{
                      display:"flex", alignItems:"center", gap:10, flexWrap:"wrap",
                      padding:"10px 14px", background:C.bg, borderRadius:8,
                      border:`1px solid ${C.bdr}`, transition:"background 0.15s",
                    }}>
                      <div style={{ flex:1, minWidth:100 }}>
                        <div style={{ fontWeight:600, fontSize:13 }}>{s.title}</div>
                        <div style={{ fontSize:11, color:C.t2 }}>{s.author} · {s.batch}</div>
                      </div>
                      <span style={{ fontSize:12, color:C.t2 }}>{s.votes} votes</span>
                      <Tag label={s.approved?"Visible":"Hidden"} color={s.approved?"#2D9A5B":"#B05000"} />
                      <SmBtn onClick={() => onToggle(s.id)}>{s.approved?"Hide":"Show"}</SmBtn>
                      <SmBtn red onClick={() => onDelete(s.id)}>Delete</SmBtn>
                    </div>
                  ))}
                </div>
              )}

              {tab === "add" && (
                <div style={{ display:"flex", flexDirection:"column", gap:14, maxWidth:380 }}>
                  <p style={{ fontSize:13, color:C.t2 }}>Manually add a submission to the gallery.</p>

                  <div>
                    <label style={{ display:"block", fontSize:12, fontWeight:600, color:C.t2, marginBottom:5 }}>
                      Cover Title <span style={{ color:"#C0392B" }}>*</span>
                    </label>
                    {/* Plain input — no wrapper — this is the fix */}
                    <input className="fi" value={aTitle}
                      onChange={e => setATitle(e.target.value)}
                      placeholder="e.g. Loom & Legacy" />
                  </div>

                  <div>
                    <label style={{ display:"block", fontSize:12, fontWeight:600, color:C.t2, marginBottom:5 }}>
                      Author Name <span style={{ color:"#C0392B" }}>*</span>
                    </label>
                    <input className="fi" value={aName}
                      onChange={e => setAName(e.target.value)}
                      placeholder="Full name" />
                  </div>

                  <div>
                    <label style={{ display:"block", fontSize:12, fontWeight:600, color:C.t2, marginBottom:5 }}>Batch</label>
                    <input className="fi" value={aBatch}
                      onChange={e => setABatch(e.target.value)}
                      placeholder="e.g. BUTEX '28" />
                  </div>

                  <div>
                    <label style={{ display:"block", fontSize:12, fontWeight:600, color:C.t2, marginBottom:5 }}>Tag</label>
                    <select className="fi" value={aTag} onChange={e => setATag(e.target.value)}>
                      {TAGS.map(t => <option key={t}>{t}</option>)}
                    </select>
                  </div>

                  <Btn primary onClick={doAdd}>Add Submission</Btn>
                </div>
              )}

            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Main App ────────────────────────────────────────────────────────────── */
function App() {
  const [page,      setPage]      = useState("home");
  const [subs,      setSubs]      = useState(DEMO);
  const [votedIds,  setVotedIds]  = useState(new Set());
  const [sortBy,    setSortBy]    = useState("votes");
  const [adminOpen, setAdminOpen] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [tl,        setTl]        = useState({ d:12, h:8, m:34, s:59 });

  /* KEY FIX: Each form field is its own flat useState at App's top level.
     Previously they were inside a TextInput wrapper component that had its
     own useState — React destroyed & recreated that component on every render,
     which moved focus away from the input after each keystroke.              */
  const [fName,  setFName]  = useState("");
  const [fBatch, setFBatch] = useState("");
  const [fTitle, setFTitle] = useState("");
  const [fDesc,  setFDesc]  = useState("");
  const [fFb,    setFFb]    = useState("");

  useEffect(() => {
    const t = setInterval(() => {
      setTl(p => {
        let { d,h,m,s } = p; s--;
        if(s<0){s=59;m--;} if(m<0){m=59;h--;} if(h<0){h=23;d--;}
        return {d,h,m,s};
      });
    }, 1000);
    return () => clearInterval(t);
  }, []);

  const approved   = subs.filter(s => s.approved);
  const sorted     = [...approved].sort((a,b) => sortBy==="votes" ? b.votes-a.votes : b.id-a.id);
  const totalVotes = subs.reduce((a,s) => a+s.votes, 0);

  const handleVote = id => {
    if (votedIds.has(id)) return;
    setVotedIds(p => new Set([...p,id]));
    setSubs(p => p.map(s => s.id===id ? {...s,votes:s.votes+1} : s));
  };

  const handleSubmit = () => {
    if (!fName.trim() || !fTitle.trim()) return;
    setSubs(p => [...p, {
      id:Date.now(), title:fTitle, author:fName,
      batch:fBatch||"BUTEX '28", votes:0, approved:false,
    }]);
    setSubmitted(true);
  };

  const resetForm = () => {
    setSubmitted(false);
    setFName(""); setFBatch(""); setFTitle(""); setFDesc(""); setFFb("");
  };

  const nav = p => { setPage(p); window.scrollTo(0,0); };

  return (
    <div style={{ minHeight:"100vh", background:C.bg, fontFamily:"'DM Sans','Segoe UI',sans-serif" }}>

      {/* ── Navbar ── */}
      <nav style={{
        position:"sticky", top:0, zIndex:200,
        background:"rgba(247,246,243,0.94)", backdropFilter:"blur(12px)",
        borderBottom:`1px solid ${C.bdr}`, padding:"0 24px", height:56,
        display:"flex", alignItems:"center", justifyContent:"space-between",
      }}>
        <div onClick={() => nav("home")} style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer", userSelect:"none" }}>
          <div style={{ width:28, height:28, background:C.ac, borderRadius:6, display:"flex", alignItems:"center", justifyContent:"center" }}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="#fff">
              <rect x="0" y="0" width="6" height="6" rx="1"/>
              <rect x="8" y="0" width="6" height="6" rx="1"/>
              <rect x="0" y="8" width="6" height="6" rx="1"/>
              <rect x="8" y="8" width="6" height="6" rx="1"/>
            </svg>
          </div>
          <div>
            <div style={{ fontSize:13, fontWeight:700, letterSpacing:1, color:C.t1, lineHeight:1 }}>BUTEX</div>
            <div style={{ fontSize:9, color:C.t2, letterSpacing:0.8 }}>COVER SELECTION</div>
          </div>
        </div>

        <div style={{ display:"flex", alignItems:"center", gap:2 }}>
          {[["home","Home"],["gallery","Gallery"],["submit","Submit"],["results","Results"]].map(([p,l]) => (
            <button key={p} className="nav-btn" onClick={() => nav(p)} style={{
              background:   page===p ? "rgba(45,107,228,0.1)" : "transparent",
              color:        page===p ? C.ac : C.t2,
              border:"none", borderRadius:6, padding:"6px 13px",
              fontSize:13, fontWeight:page===p?600:400,
              cursor:"pointer", fontFamily:"inherit", transition:"background 0.15s",
            }}><span className="nav-label">{l}</span></button>
          ))}
          <button title="Admin" onClick={() => setAdminOpen(true)} style={{
            marginLeft:6, background:"none", border:`1px solid ${C.bdr}`,
            borderRadius:5, padding:"4px 9px", fontSize:13,
            color:C.t2, cursor:"pointer",
          }}>⚙</button>
        </div>
      </nav>

      {adminOpen && (
        <AdminModal
          onClose={() => setAdminOpen(false)}
          subs={subs}
          onToggle={id => setSubs(p => p.map(s => s.id===id ? {...s,approved:!s.approved} : s))}
          onDelete={id => setSubs(p => p.filter(s => s.id!==id))}
          onAdd={({ title,name,batch,tag }) => setSubs(p => [...p,{
            id:Date.now(), title, author:name,
            batch:batch||"BUTEX '28", votes:0, approved:true,
          }])}
        />
      )}

      <main style={{ maxWidth:1080, margin:"0 auto", padding:"0 24px" }}>

        {/* ══ HOME ══ */}
        {page==="home" && (
          <div className="fade-in">
            <div style={{ padding:"70px 0 44px", borderBottom:`1px solid ${C.bdr}` }}>
              <p style={{ fontSize:11, fontWeight:700, letterSpacing:2.5, color:C.ac, textTransform:"uppercase", marginBottom:18 }}>
                Bangladesh University of Textiles · 2026
              </p>
              <h1 style={{ fontSize:"clamp(28px,5vw,50px)", fontWeight:700, letterSpacing:-1, lineHeight:1.15, color:C.t1, maxWidth:500, marginBottom:16 }}>
                Department Cover<br/>Selection
              </h1>
              <p style={{ fontSize:15, color:C.t2, maxWidth:400, lineHeight:1.85, marginBottom:32 }}>
                Submit your cover design, vote for your favourite, and see which design represents our department in 2026.
              </p>
              <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                <Btn primary onClick={() => nav("submit")}>Submit Your Design</Btn>
                <Btn onClick={() => nav("gallery")}>Browse Designs</Btn>
              </div>
            </div>

            <div style={{ display:"flex", gap:14, padding:"26px 0 30px", borderBottom:`1px solid ${C.bdr}`, flexWrap:"wrap" }}>
              {[
                { label:"Submissions", val:approved.length },
                { label:"Total Votes", val:totalVotes },
                { label:"Days Left",   val:tl.d },
                { label:"Time Left",   val:`${pad(tl.h)}:${pad(tl.m)}:${pad(tl.s)}` },
              ].map(({label,val}) => (
                <div key={label} style={{ padding:"14px 22px", background:C.sur, borderRadius:8, border:`1px solid ${C.bdr}`, textAlign:"center", minWidth:110 }}>
                  <div style={{ fontSize:22, fontWeight:700, color:C.t1, fontVariantNumeric:"tabular-nums" }}>{val}</div>
                  <div style={{ fontSize:11, color:C.t2, marginTop:3 }}>{label}</div>
                </div>
              ))}
            </div>

            <div style={{ padding:"38px 0 64px" }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:22 }}>
                <h2 style={{ fontSize:17, fontWeight:700, color:C.t1 }}>Latest Submissions</h2>
                <button onClick={() => nav("gallery")} style={{ background:"none", border:"none", color:C.ac, fontSize:13, fontWeight:500, cursor:"pointer" }}>View all →</button>
              </div>
              {approved.length===0
                ? <p style={{ color:C.t2, fontSize:13 }}>No submissions yet. Be the first!</p>
                : <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))", gap:14 }}>
                    {sorted.slice(0,3).map(s => <Card key={s.id} s={s} onVote={handleVote} voted={votedIds.has(s.id)} />)}
                  </div>
              }
            </div>
          </div>
        )}

        {/* ══ GALLERY ══ */}
        {page==="gallery" && (
          <div className="fade-in" style={{ padding:"48px 0 72px" }}>
            <h1 style={{ fontSize:26, fontWeight:700, marginBottom:6, color:C.t1 }}>Gallery</h1>
            <p style={{ fontSize:13, color:C.t2, marginBottom:26 }}>{approved.length} design{approved.length!==1?"s":""} by BUTEX students</p>
            <div style={{ display:"flex", gap:8, marginBottom:28 }}>
              {[["votes","Top Voted"],["newest","Newest"]].map(([v,l]) => (
                <button key={v} onClick={() => setSortBy(v)} style={{
                  padding:"6px 14px", fontSize:12, fontWeight:600, fontFamily:"inherit",
                  borderRadius:5, cursor:"pointer",
                  background: sortBy===v ? C.ac : C.sur,
                  color:      sortBy===v ? "#fff" : C.t2,
                  border:`1px solid ${sortBy===v ? C.ac : C.bdr}`,
                }}>{l}</button>
              ))}
            </div>
            {approved.length===0
              ? <p style={{ color:C.t2, fontSize:14 }}>No approved submissions yet.</p>
              : <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))", gap:14 }}>
                  {sorted.map(s => <Card key={s.id} s={s} onVote={handleVote} voted={votedIds.has(s.id)} />)}
                </div>
            }
          </div>
        )}

        {/* ══ SUBMIT ══ */}
        {page==="submit" && (
          <div className="fade-in" style={{ maxWidth:480, padding:"52px 0 80px" }}>
            {submitted ? (
              <div style={{ textAlign:"center", paddingTop:24 }}>
                <div style={{
                  width:64, height:64, borderRadius:"50%",
                  background:"#EAF7EF", border:"2px solid #2D9A5B",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:26, margin:"0 auto 20px",
                }}>✓</div>
                <h2 style={{ fontSize:22, fontWeight:700, color:"#2D9A5B", marginBottom:10 }}>Design Submitted!</h2>
                <p style={{ fontSize:14, color:C.t2, lineHeight:1.8, maxWidth:340, margin:"0 auto 28px" }}>
                  Your submission is pending admin review. Once approved it will appear in the gallery.
                </p>
                <div style={{ display:"flex", gap:10, justifyContent:"center" }}>
                  <Btn primary onClick={() => { nav("gallery"); resetForm(); }}>View Gallery</Btn>
                  <Btn onClick={resetForm}>Submit Another</Btn>
                </div>
              </div>
            ) : (
              <div>
                <h1 style={{ fontSize:24, fontWeight:700, marginBottom:6, color:C.t1 }}>Submit Your Design</h1>
                <p style={{ fontSize:13, color:C.t2, marginBottom:32 }}>Share your vision for the BUTEX 2026 department cover.</p>

                {/* ── All inputs are plain <input> with no wrapper component ── */}
                <div style={{ marginBottom:18 }}>
                  <label style={{ display:"block", fontSize:12, fontWeight:600, color:C.t2, marginBottom:6 }}>
                    Full Name <span style={{ color:"#C0392B" }}>*</span>
                  </label>
                  <input className="fi" value={fName} onChange={e => setFName(e.target.value)} placeholder="Your full name" />
                </div>

                <div style={{ marginBottom:18 }}>
                  <label style={{ display:"block", fontSize:12, fontWeight:600, color:C.t2, marginBottom:6 }}>Batch / Section</label>
                  <input className="fi" value={fBatch} onChange={e => setFBatch(e.target.value)} placeholder="e.g. BUTEX '28, Section A" />
                </div>

                <div style={{ marginBottom:18 }}>
                  <label style={{ display:"block", fontSize:12, fontWeight:600, color:C.t2, marginBottom:6 }}>
                    Cover Title <span style={{ color:"#C0392B" }}>*</span>
                  </label>
                  <input className="fi" value={fTitle} onChange={e => setFTitle(e.target.value)} placeholder="Give your design a title" />
                </div>

                <div style={{ marginBottom:18 }}>
                  <label style={{ display:"block", fontSize:12, fontWeight:600, color:C.t2, marginBottom:6 }}>
                    Facebook Profile <span style={{ fontWeight:400, color:C.t2 }}>(optional)</span>
                  </label>
                  <input className="fi" value={fFb} onChange={e => setFFb(e.target.value)} placeholder="facebook.com/yourname" />
                </div>

                <div style={{ marginBottom:24 }}>
                  <label style={{ display:"block", fontSize:12, fontWeight:600, color:C.t2, marginBottom:6 }}>Short Description</label>
                  <textarea className="fi" value={fDesc} onChange={e => setFDesc(e.target.value)}
                    placeholder="What inspired this design?" rows={3} />
                </div>

                <div className="upload-zone" style={{
                  border:`2px dashed ${C.bdr}`, borderRadius:8,
                  padding:"28px 20px", textAlign:"center", marginBottom:24, cursor:"pointer",
                }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.t2} strokeWidth="1.5" strokeLinecap="round"
                    style={{ display:"block", margin:"0 auto 8px" }}>
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                  <div style={{ fontSize:13, color:C.t1, fontWeight:500, marginBottom:4 }}>Upload cover image</div>
                  <div style={{ fontSize:12, color:C.t2 }}>PNG or JPG · Recommended 1640 × 924 px</div>
                </div>

                <Btn primary onClick={handleSubmit}>Submit Design</Btn>
                {(!fName.trim()||!fTitle.trim()) && (
                  <p style={{ fontSize:11, color:C.t2, marginTop:8 }}>* Name and title are required.</p>
                )}
              </div>
            )}
          </div>
        )}

        {/* ══ RESULTS ══ */}
        {page==="results" && (
          <div className="fade-in" style={{ padding:"48px 0 72px" }}>
            <h1 style={{ fontSize:26, fontWeight:700, marginBottom:6, color:C.t1 }}>Results</h1>
            <p style={{ fontSize:13, color:C.t2, marginBottom:36 }}>Live vote counts — updates the moment someone votes.</p>

            {sorted.length===0 && <p style={{ color:C.t2, fontSize:14 }}>No submissions to show yet.</p>}

            {sorted[0] && (
              <div style={{
                background:C.sur, border:`1px solid ${C.bdr}`, borderRadius:10,
                padding:"22px 26px", marginBottom:20,
                display:"flex", gap:22, alignItems:"center", flexWrap:"wrap",
              }}>
                <div style={{
                  width:108, height:76, background:chipColor(sorted[0])+"14",
                  borderRadius:8, border:`1px solid ${C.bdr}`,
                  display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4, flexShrink:0,
                }}>
                  <div style={{ width:22, height:2, background:chipColor(sorted[0]), borderRadius:2 }} />
                  <span style={{ fontSize:8, letterSpacing:2, color:chipColor(sorted[0]), fontWeight:700 }}>BUTEX</span>
                  <span style={{ fontSize:10, fontWeight:700, color:C.t1, textAlign:"center", padding:"0 6px" }}>{sorted[0].title}</span>
                  <div style={{ width:22, height:2, background:chipColor(sorted[0]), borderRadius:2 }} />
                </div>
                <div>
                  <p style={{ fontSize:10, fontWeight:700, letterSpacing:1.5, color:"#B08000", textTransform:"uppercase", marginBottom:6 }}>🏆 Current Leader</p>
                  <h2 style={{ fontSize:20, fontWeight:700, color:C.t1, marginBottom:4 }}>{sorted[0].title}</h2>
                  <p style={{ fontSize:13, color:C.t2, marginBottom:14 }}>by {sorted[0].author} · {sorted[0].batch}</p>
                  <div style={{ display:"flex", gap:10 }}>
                    {[{v:sorted[0].votes,l:"Votes"},{v:"#1",l:"Rank"}].map(({v,l}) => (
                      <div key={l} style={{ padding:"7px 14px", background:C.bg, borderRadius:6, border:`1px solid ${C.bdr}`, textAlign:"center" }}>
                        <div style={{ fontSize:16, fontWeight:700, color:C.t1 }}>{v}</div>
                        <div style={{ fontSize:10, color:C.t2 }}>{l}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            <h3 style={{ fontSize:12, fontWeight:700, color:C.t2, letterSpacing:1.5, textTransform:"uppercase", marginBottom:12 }}>Full Rankings</h3>
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {sorted.map((s,i) => {
                const pct = Math.round((s.votes/(sorted[0]?.votes||1))*100);
                return (
                  <div key={s.id} style={{
                    background:C.sur, border:`1px solid ${C.bdr}`,
                    borderRadius:8, padding:"12px 16px",
                    display:"flex", alignItems:"center", gap:12,
                  }}>
                    <div style={{
                      width:28, height:28, borderRadius:"50%", flexShrink:0,
                      background: i===0?"#FFF8D6":C.bg,
                      border:`1px solid ${i===0?"#D4A800":C.bdr}`,
                      display:"flex", alignItems:"center", justifyContent:"center",
                      fontSize:12, fontWeight:700, color:i===0?"#B08000":C.t2,
                    }}>{i+1}</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontWeight:600, fontSize:13, color:C.t1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{s.title}</div>
                      <div style={{ fontSize:11, color:C.t2 }}>{s.author}</div>
                    </div>
                    <div style={{ width:120, flexShrink:0 }}>
                      <div style={{ height:4, background:C.bg, borderRadius:2, overflow:"hidden", border:`1px solid ${C.bdr}`, marginBottom:3 }}>
                        <div style={{ height:"100%", borderRadius:2, width:`${pct}%`, background:chipColor(s), transition:"width 0.5s" }} />
                      </div>
                      <div style={{ fontSize:11, color:C.t2, textAlign:"right" }}>{s.votes} votes</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

      </main>

      <footer style={{ borderTop:`1px solid ${C.bdr}`, padding:"18px 24px", textAlign:"center", color:C.t2, fontSize:11, letterSpacing:0.4 }}>
        BUTEX Department Cover Selection 2026 · Made by first-year students
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
